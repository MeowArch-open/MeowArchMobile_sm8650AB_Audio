# zorn's three real paths. Playback front ends: MultiMedia1 = hw:0,0,
# MultiMedia2 = hw:0,1; capture: MultiMedia3 = hw:0,2.

SectionVerb {
	EnableSequence [
	]

	DisableSequence [
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Loudspeakers, two SIA9187 on secondary MI2S"

	EnableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Headphones" {
	Comment "Headphone jack, WCD9395"

	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='HPHL_RDAC Switch' 1"
		cset "name='HPHR_RDAC Switch' 1"
		cset "name='HPHL Switch' 1"
		cset "name='HPHR Switch' 1"
		cset "name='RX_RX0 Digital Volume' 84"
		cset "name='RX_RX1 Digital Volume' 84"
	]

	DisableSequence [
		cset "name='HPHL Switch' 0"
		cset "name='HPHR Switch' 0"
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Mic" {
	Comment "Built-in microphones, DMIC on the VA macro (records silence for now)"

	EnableSequence [
		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 1"
		cset "name='VA DEC0 MUX' MSM_DMIC"
		cset "name='VA DMIC MUX0' DMIC0"
		cset "name='VA_DEC0 Volume' 84"
	]

	DisableSequence [
		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 0"
	]

	Value {
		CaptureChannels 1
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixer "default:${CardId}"
	}
}
