# UCM for zorn (Xiaomi Redmi K80, SM8650).
#
# The file name is what matters. ucm2/ucm.conf only ever probes two paths for a
# real card:
#
#     ucm2/conf.d/${CardDriver}/${CardLongName}.conf
#     ucm2/conf.d/${CardDriver}/${CardDriver}.conf
#
# On zorn that is conf.d/sm8650/XiaoMi-K80-zorn-zorn.conf or conf.d/sm8650/
# sm8650.conf -- so alsa-ucm-conf's own SM8650-MTP.conf is never reached, the
# import fails with -2, and PipeWire ends up with no profile at all. That is why
# KDE showed no speaker: nothing to do with the amplifiers.
#
# It also has to be zorn-specific in content: the shipped MTP config drives
# WSA_CODEC_DMA_RX_0 and the wsa884x sequences, and zorn has no WSA speakers
# (all four wsa884x are disabled in the vendor DT and UNATTACHED on SoundWire).

Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8650/zorn/HiFi.conf"
	Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
