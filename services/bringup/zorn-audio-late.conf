# Keep the AudioReach stack out of the boot race so pd-mapper can win it.
#
# q6apm sends APM_CMD_GET_SPF_STATE about 3.93 s into boot and gives up 5 s
# later; zorn-pd-mapper.service only reaches "Started" at 4.14 s. pd-mapper is
# what answers the servreg locator the ADSP's audio protection domain is looked
# up through, so on the current ordering the very first APM command goes out
# before anything can have started that PD.
#
# Blacklisting only stops the autoload -- modprobe still works -- so the test is
# "boot, confirm pd-mapper is up, then load it by hand and watch for the
# timeout". Remove this file once the ordering question is settled.
blacklist snd_q6apm
